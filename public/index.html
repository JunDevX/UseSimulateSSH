<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UseSimulateSSH — Web Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background-color: #050505; overflow: hidden; }
    #terminal-container { width: 100vw; height: 100vh; padding: 10px; }
  </style>
</head>
<body>
  <div id="terminal-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'block',
      fontFamily: 'Consolas, "Liberation Mono", "Courier New", monospace',
      fontSize: 15,
      theme: {
        background: '#050505',
        foreground: '#00ff66',
        cursor: '#00ff66',
        selectionBackground: 'rgba(0, 255, 102, 0.3)'
      }
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal-container'));

    setTimeout(() => fitAddon.fit(), 100);
    window.addEventListener('resize', () => fitAddon.fit());

    let inputBuffer = '';

    term.onData(data => {
      const charCode = data.charCodeAt(0);

      if (charCode === 13) {
        socket.emit('input', inputBuffer);
        inputBuffer = '';
      } else if (charCode === 127) {
        if (inputBuffer.length > 0) {
          inputBuffer = inputBuffer.slice(0, -1);
          term.write('\b \b');
        }
      } else if (charCode < 32) {
        return;
      } else {
        inputBuffer += data;
        term.write(data);
      }
    });

    socket.on('output', (data) => {
      term.write(data.replace(/\n/g, '\r\n'));
    });

    socket.on('clear', () => {
      term.clear();
      inputBuffer = '';
    });

    socket.on('change_color', (hexColor) => {
      term.options.theme = {
        background: '#050505',
        foreground: hexColor,
        cursor: hexColor,
        selectionBackground: hexColor + '44'
      };
    });
  </script>
</body>
</html>
